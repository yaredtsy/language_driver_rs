# Shape and reasons: docs/01-monorepo/05-ci.md
name: ci
# No workflow-level `paths:` filter: a workflow that does not start reports nothing, and a required check that
# never reports blocks the pull request forever. Jobs are skipped with `if:` instead.
# `push` is for main only: a branch is tested through its pull request, so a push to a PR branch starts one run, not two.
# `workflow_dispatch` runs a branch without a PR (no base: everything runs).
on: { pull_request: {}, push: { branches: [main] }, workflow_dispatch: {} }

permissions: { contents: read }

# A newer push to the same PR cancels the older run. main and runs by hand are never cancelled: each merge gets a complete run,
# which is also the run that saves the caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.f.outputs.core }}
      languages: ${{ steps.f.outputs.languages }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: f
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          scripts/changed-languages.sh "$base" "${{ github.sha }}" | tee -a "$GITHUB_OUTPUT"

  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-all.sh --static

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@v4
      # `key:` and `save-if:` reasons: docs/01-monorepo/05-ci.md §4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo doc --locked --no-deps
        env: { RUSTDOCFLAGS: "-D warnings" }

  # A language's fast crate: `cargo test -p <lang>-syntax` never compiles the type checker.
  syntax:
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.changes.outputs.languages) }}
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults: { run: { working-directory: "languages/${{ matrix.lang }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "languages/${{ matrix.lang }}"
          key: ${{ matrix.lang }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked -p ${{ matrix.lang }}-syntax --all-targets -- -D warnings
      - run: cargo test --locked -p ${{ matrix.lang }}-syntax

  # The slow crates, and the scenarios for that language.
  analysis:
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.changes.outputs.languages) }}
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults: { run: { working-directory: "languages/${{ matrix.lang }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "languages/${{ matrix.lang }}"
          key: ${{ matrix.lang }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p ${{ matrix.lang }}-analysis -p ${{ matrix.lang }}-cli --all-targets -- -D warnings
      # --no-fail-fast: a failing test binary must not hide the results of the others
      - run: cargo test --locked --no-fail-fast -p ${{ matrix.lang }}-analysis -p ${{ matrix.lang }}-cli
      # compile-fail proofs sit behind a feature, so `cargo test` above does not see them (scripts/check-proofs.sh says why)
      - run: ../../scripts/check-proofs.sh ${{ matrix.lang }}
        shell: bash

  # The one required check. `if: always()` so it runs (and decides) even when a dependency was skipped.
  ci-ok:
    needs: [changes, repo, core, syntax, analysis]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: every needed job succeeded or was skipped
        env: { NEEDS: "${{ toJSON(needs) }}" }
        run: echo "$NEEDS" | python3 scripts/all-ok.py
