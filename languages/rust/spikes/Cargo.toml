[workspace]
resolver = "3"
members = ["s1-syntax", "s1-hir", "s1-ide", "s4-docs", "s2-policy", "s2-oracle", "s2-cancel"]
exclude = ["fixtures"]

[workspace.package]
edition = "2024"
publish = false

# one pin for every ra_ap_* crate: hir, ide, ide_db, load-cargo and project_model stop at 0.0.358
[workspace.dependencies]
ra_ap_syntax        = "=0.0.358"
ra_ap_parser        = "=0.0.358"
ra_ap_hir           = "=0.0.358"
ra_ap_ide_db        = "=0.0.358"
ra_ap_ide           = "=0.0.358"
ra_ap_load-cargo    = "=0.0.358"
ra_ap_project_model = "=0.0.358"
ra_ap_vfs           = "=0.0.358"

[profile.dev]
debug = 0
[profile.release]
debug = 0
