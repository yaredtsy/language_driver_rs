[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
analyzer-core    = { path = "../../core/analyzer-core" }
analyzer-testkit = { path = "../../core/analyzer-testkit" }

# the engine: ONE version, written once (ENGINE.md records why this one). `hir`, `ide`, `ide_db`, `load-cargo` and `project_model` stop at 0.0.358
# on crates.io, so every `ra_ap_*` crate is pinned to it, with `=`: the set moves together. `ra_ap_hir` and the rest are used from RS3 on.
ra_ap_syntax        = "=0.0.358"
ra_ap_hir           = "=0.0.358"
ra_ap_ide_db        = "=0.0.358"
ra_ap_load-cargo    = "=0.0.358"
ra_ap_project_model = "=0.0.358"
ra_ap_vfs           = "=0.0.358"
ra_ap_ide           = "=0.0.358"

rust-syntax   = { path = "crates/rust-syntax" }
rust-analysis = { path = "crates/rust-analysis" }

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
