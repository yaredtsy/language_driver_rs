[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
analyzer-core    = { path = "../../core/analyzer-core" }
analyzer-testkit = { path = "../../core/analyzer-testkit" }

# --- ruff/ty, all from ONE local checkout at vendor/ruff (ENGINE.md records the pin) ---
# vendor/ruff/Cargo.toml is ruff's own, UNCHANGED: every `workspace = true` line in vendor/ruff/crates/* resolves
# against it, not against this file. This file is not that root (hence `exclude = ["vendor"]` above); it only
# depends on ruff/ty's crates by path.
ruff_python_ast    = { path = "vendor/ruff/crates/ruff_python_ast" }
ruff_python_parser = { path = "vendor/ruff/crates/ruff_python_parser" }
ruff_text_size     = { path = "vendor/ruff/crates/ruff_text_size" }

python-syntax   = { path = "crates/python-syntax" }
python-analysis = { path = "crates/python-analysis" }

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
