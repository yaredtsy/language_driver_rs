[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
analyzer-core    = { path = "../../core/analyzer-core" }
analyzer-testkit = { path = "../../core/analyzer-testkit" }

# --- ruff/ty, all from ONE local checkout at vendor/ruff (ENGINE.md records the pin) ---
# vendor/ruff/Cargo.toml is ruff's own, UNCHANGED: every `workspace = true` line in vendor/ruff/crates/* resolves
# against it, not against this file. This file is not that root (hence `exclude = ["vendor"]` above); it only
# depends on ruff/ty's crates by path.
ruff_db = { path = "vendor/ruff/crates/ruff_db", default-features = false, features = ["os"] }
ruff_index         = { path = "vendor/ruff/crates/ruff_index" }
ruff_python_ast    = { path = "vendor/ruff/crates/ruff_python_ast" }
ruff_python_parser = { path = "vendor/ruff/crates/ruff_python_parser" }
ruff_python_stdlib = { path = "vendor/ruff/crates/ruff_python_stdlib" }
ruff_source_file   = { path = "vendor/ruff/crates/ruff_source_file" }
ruff_text_size     = { path = "vendor/ruff/crates/ruff_text_size" }
ty_module_resolver = { path = "vendor/ruff/crates/ty_module_resolver" }
# "zstd": ty_project's own default feature. `default-features = false` is what ruff's own root table uses for it too, safe there only
# because ruff's own `ty` binary crate re-enables zstd itself (`crates/ty/Cargo.toml`). We are that binary here, so we re-enable it
# too: without it, vendored-typeshed decompression breaks silently.
ty_project         = { path = "vendor/ruff/crates/ty_project", default-features = false, features = ["zstd"] }
ty_python_core     = { path = "vendor/ruff/crates/ty_python_core" }
ty_python_semantic = { path = "vendor/ruff/crates/ty_python_semantic" }

# Shared with ruff: copied verbatim from vendor/ruff/Cargo.toml, not retyped, so cargo's feature unification keeps exactly one of each
# in the graph (two salsa copies would mean two incompatible `Db` traits).
salsa = { version = "0.28.2", default-features = false, features = ["compact_str", "macros", "salsa_unstable", "inventory"] }
rustc-hash = { version = "2.0.0" }
thin-vec = { version = "0.2.14" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { version = "1.0.113" }
anyhow = { version = "1.0.80" }
smallvec = { version = "1.13.2", features = ["union", "const_generics", "const_new"] }
rpds = "1.2.1"
# a fixed 128-bit hash: stable ids must not change across Rust versions or platforms
xxhash-rust = { version = "0.8", features = ["xxh3"] }

python-syntax   = { path = "crates/python-syntax" }
python-analysis = { path = "crates/python-analysis" }

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
