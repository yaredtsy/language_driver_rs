[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
analyzer-core    = { path = "../../core/analyzer-core" }
analyzer-testkit = { path = "../../core/analyzer-testkit" }

# the engine: ONE rev, written once (ENGINE.md records why this one)
tsrs_parser    = { git = "https://github.com/oxc-project/tsrs.git", rev = "13a31a4cac36b980db090a91ec12a3c3686de14d" }
tsrs_ast       = { git = "https://github.com/oxc-project/tsrs.git", rev = "13a31a4cac36b980db090a91ec12a3c3686de14d" }
tsrs_core      = { git = "https://github.com/oxc-project/tsrs.git", rev = "13a31a4cac36b980db090a91ec12a3c3686de14d" }
tsrs_scanner   = { git = "https://github.com/oxc-project/tsrs.git", rev = "13a31a4cac36b980db090a91ec12a3c3686de14d" }
tsrs_compiler  = { git = "https://github.com/oxc-project/tsrs.git", rev = "13a31a4cac36b980db090a91ec12a3c3686de14d" }
tsrs_checker   = { git = "https://github.com/oxc-project/tsrs.git", rev = "13a31a4cac36b980db090a91ec12a3c3686de14d" }
tsrs_tsoptions = { git = "https://github.com/oxc-project/tsrs.git", rev = "13a31a4cac36b980db090a91ec12a3c3686de14d" }
tsrs_vfs       = { git = "https://github.com/oxc-project/tsrs.git", rev = "13a31a4cac36b980db090a91ec12a3c3686de14d" }

typescript-syntax   = { path = "crates/typescript-syntax" }
typescript-analysis = { path = "crates/typescript-analysis" }

[workspace.lints.rust]
unreachable_pub = "warn"
# deny, not forbid: `sem.rs` has one `#[allow(unsafe_code)]`, on the `Drop` that calls tsrs's `unsafe fn free_unshared_program` (ENGINE.md, S-TS3)
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
