# The engine's node accessors that panic on a kind they do not handle (`_ => panic!("Unhandled case in Node.…")` in `tsrs_ast/src/ast.rs`, at the pin of
# `languages/typescript/ENGINE.md`). Only `src/sem/view/` calls them, behind a `cast` of the kinds each one handles (H14, `docs/03-typescript/10-review-fixes.md`
# §6.2); everything else asks a view. The paths are the inherent methods of `tsrs_ast::Node`, so `text` of another type (a `SourceFile`'s) is not matched.
disallowed-methods = [
    { path = "tsrs_ast::Node::text", reason = "panics on a kind it does not handle: ask a view in sem/view/ (H14)" },
