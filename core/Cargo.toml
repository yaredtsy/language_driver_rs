[workspace]
resolver = "3"
members = ["analyzer-core", "analyzer-testkit"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# a fixed 128-bit hash: a context's digest is stored outside the process and must not change across Rust versions or platforms
xxhash-rust = { version = "0.8", features = ["xxh3"] }
analyzer-core = { path = "analyzer-core" }
